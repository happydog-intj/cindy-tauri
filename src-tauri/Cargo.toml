[package]
name = "cindy-tauri"
version = "0.0.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：Window::add_child（浏览器面板的子 webview）需要。
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 主密钥存系统钥匙串：macOS Keychain / Windows 凭据管理器。
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
getrandom = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.14.1"

# 浏览器面板的前进 / 后退 / 停止：Tauri 没有封装，直接调原生 webview。版本跟 wry 用的一致。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKNavigation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
# 从桌面版导入时用 DPAPI 解开 Electron safeStorage 的 AES key。
# 自动更新的「空闲时重启」用 GetLastInputInfo 取系统无操作时长。
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
