[package]
name = "cindy-tauri"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 主密钥存系统钥匙串：macOS Keychain / Windows 凭据管理器。
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
