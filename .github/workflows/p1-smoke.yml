name: p1-smoke

on:
  push:
    branches: [main]
    # v* 标签：同一套构建和冒烟通过后，用正式更新签名密钥出包并发布到本仓库 Releases（publish 任务）。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # 与本地验证用的 cindy 版本一致；cindy-headless 0.4.3。
  CINDY_REF: 628f32170e046cdb5869ac58ccac7b201c748495

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 镜像已被 GitHub 下线（The configuration ... is not supported）。
          - os: macos-15
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm ci

      # cindy-headless：按固定 commit 检出，只装它自己的依赖，跳过 postinstall（会拉 Electron 和 agent 二进制）。
      - uses: actions/checkout@v4
        with:
          repository: makecindy/cindy
          ref: ${{ env.CINDY_REF }}
          path: .cache/cindy

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .cache/cindy/package.json

      - name: Build cindy-headless
        working-directory: .cache/cindy
        run: |
          pnpm install --filter cindy-headless... --filter "desktop..." --ignore-scripts
          pnpm --filter cindy-headless build

      # 真实 renderer：只跑 vite renderer 构建，不碰 Electron 主进程。
      - name: Build cindy renderer
        working-directory: .cache/cindy/apps/desktop
        # 与 cindy 自己的 CI 一致，renderer 打包需要较大的堆。登录页按区域烘焙：Tauri 只做 global 区。
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_CINDY_AUTH_REGION: global
        run: npx vite build --config vite.renderer.config.ts

      # sidecar 复用 cindy desktop shared/ 下的纯函数模块。
      - name: Build sidecar bundle
        env:
          CINDY_DIR: .cache/cindy
        run: npm run sidecar:build

      - name: Build frontend (renderer + preload shim)
        run: node scripts/build-frontend.mjs .cache/cindy

      - name: Bundle cindy-headless into sidecar
        run: npm run headless:fetch -- .cache/cindy

      # 原生模块（node-pty）：只带目标平台的预编译文件，Windows 只带 ConPTY。
      - name: Bundle native modules into sidecar
        run: npm run native:fetch -- ${{ matrix.triple }}

      # 桌面外壳 IPC（通知 / 角标 / 对话框 / 打开链接 / 关闭行为 / 托盘文案），脚本扮演 Rust 回反向调用。
      # sidecar 启动需要 headless/ 已打包，放在 headless:fetch 之后。
      - name: Desktop shell e2e
        run: node scripts/desktop-shell-e2e.mjs

      - name: Settings e2e
        run: node scripts/settings-e2e.mjs

      - name: Browser panel e2e
        run: node scripts/browser-e2e.mjs

      - name: Desktop import e2e
        run: node scripts/desktop-import-e2e.mjs

      # 真实 PTY：macOS 用默认 shell，Windows 11 用 PowerShell + ConPTY。
      - name: Terminal e2e
        run: node scripts/terminal-e2e.mjs

      # 自动更新状态机：脚本扮演 Rust 回 update.*，覆盖检查 / 下载进度 / 失败回退 / superseding / 空闲自动重启。
      - name: Update e2e
        run: node scripts/update-e2e.mjs

      # 运行中切换模型：同来源 / 跨来源热切、回合中延期、落库、重启后按新模型重建（mock 模型，会下载 Pi）。
      - name: Model switch e2e
        run: node scripts/model-switch-e2e.mjs

      # Cindy 账号登录与云端模型：mock auth / model-access / 网关，邮箱验证码 + 浏览器登录、续期、
      # 退出、本地网关转发（上游只见真实 key、没有内部头）、余额。
      - name: Auth e2e
        run: node scripts/auth-e2e.mjs

      # 更新签名密钥：v* 标签用仓库 secret 里的正式密钥（和 tauri.conf.json 的 pubkey 配对）；
      # 其余构建用一次性密钥并覆盖 pubkey，正式私钥不进普通 CI。
      - name: Updater signing key
        shell: bash
        env:
          RELEASE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          if [ -n "$RELEASE_KEY" ]; then
            printf '%s' "$RELEASE_KEY" > "$RUNNER_TEMP/updater.key"
            echo '{}' > "$RUNNER_TEMP/updater-ci.json"
          else
            npx tauri signer generate --ci -p "" -w "$RUNNER_TEMP/updater.key" > /dev/null
            node -e "const fs=require('fs');fs.writeFileSync(process.argv[2],JSON.stringify({plugins:{updater:{pubkey:fs.readFileSync(process.argv[1],'utf8').trim()}}}))" "$RUNNER_TEMP/updater.key.pub" "$RUNNER_TEMP/updater-ci.json"
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/updater.key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
          # 更新冒烟用的「新版本」= 当前版本 patch + 1
          node -e "const c=require('./src-tauri/tauri.conf.json');const [a,b,p]=c.version.split('-')[0].split('.').map(Number);console.log('APP_VERSION='+c.version);console.log('NEXT_VERSION='+a+'.'+b+'.'+(p+1))" >> "$GITHUB_ENV"

      - name: Fetch Node runtime for sidecar
        run: npm run node:fetch -- ${{ matrix.triple }}

      - name: Build app
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }} -c "$RUNNER_TEMP/updater-ci.json"

      # 发布产物先挪出 bundle 目录（后面的更新冒烟会重新打包覆盖它），文件名去掉空格（GitHub 会把空格改成点）。
      - name: Verify bundle signature (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # ad-hoc 签名也要封住 Resources，否则下载后 Gatekeeper 报「已损坏」而不是「无法验证开发者」
          APP="src-tauri/target/release/bundle/macos/Cindy Tauri.app"
          codesign --verify --deep --strict -v "$APP"
          codesign -dv "$APP" 2>&1 | grep -E '^(Identifier|Sealed Resources)='
          "$APP/Contents/MacOS/cindy-node" -p process.version
      - name: Stage release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          D="$RUNNER_TEMP/release" && mkdir -p "$D"
          B=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$B/macos/Cindy Tauri.app.tar.gz" "$D/Cindy-Tauri_${APP_VERSION}_aarch64.app.tar.gz"
            cp "$B/macos/Cindy Tauri.app.tar.gz.sig" "$D/Cindy-Tauri_${APP_VERSION}_aarch64.app.tar.gz.sig"
            cp "$B/dmg/"*.dmg "$D/Cindy-Tauri_${APP_VERSION}_aarch64.dmg"
          else
            cp "$B/nsis/"*"_${APP_VERSION}_x64-setup.exe" "$D/Cindy-Tauri_${APP_VERSION}_x64-setup.exe"
            cp "$B/nsis/"*"_${APP_VERSION}_x64-setup.exe.sig" "$D/Cindy-Tauri_${APP_VERSION}_x64-setup.exe.sig"
          fi
          ls -l "$D"

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.triple }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

      # 桌面版导入的 DPAPI 解包只能在 Windows 上验证。
      - name: Rust unit tests (Windows DPAPI)
        if: runner.os == 'Windows'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml desktop_import

      # CI 没有本机模型地址，只验证到 Pi 按需下载；真实任务在本地设置
      # CINDY_TAURI_SMOKE_MODEL_BASE_URL / CINDY_TAURI_SMOKE_MODEL_ID 后运行。
      # 首屏通过后再巡检设置页各分区（CINDY_TAURI_SMOKE_SETTINGS=1），出现错误边界即失败。
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          CINDY_TAURI_SMOKE_SETTINGS: '1'
        run: node scripts/smoke.mjs "src-tauri/target/release/bundle/macos/Cindy Tauri.app/Contents/MacOS/cindy-tauri"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          CINDY_TAURI_SMOKE_SETTINGS: '1'
        run: node scripts/smoke.mjs "src-tauri/target/release/cindy-tauri.exe"

      # 会话冒烟：mock 模型（scripts/mock-openai.mjs）+ 同一数据目录启动两次（run / verify），
      # 覆盖新建会话、流式回复、Ask 模式批准工具调用、重启后会话列表仍在。
      - name: Session smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          CINDY_TAURI_SMOKE_LOG_DIR: ${{ runner.temp }}/session-smoke-logs
        run: node scripts/smoke.mjs "src-tauri/target/release/bundle/macos/Cindy Tauri.app/Contents/MacOS/cindy-tauri" --session

      - name: Session smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          CINDY_TAURI_SMOKE_LOG_DIR: ${{ runner.temp }}/session-smoke-logs
        run: node scripts/smoke.mjs "src-tauri/target/release/cindy-tauri.exe" --session

      - name: Upload session smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-smoke-logs-${{ matrix.triple }}
          path: ${{ runner.temp }}/session-smoke-logs/
          if-no-files-found: ignore

      - name: Report bundle sizes
        if: always()
        shell: bash
        run: |
          find src-tauri/target/release/bundle -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' \) -exec ls -l {} \;
          du -sh src-tauri/target/release/bundle/* || true

      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cindy-tauri-${{ matrix.triple }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: ignore

      # 自动更新冒烟：上面的 0.0.1 包作为旧版本，再打一个 0.0.2 的更新包，
      # 旧版本经本机 latest.json 检查 → 下载 → 验签 → 安装 → 以 0.0.2 启动。
      # macOS 额外验证篡改过的包会被签名校验拒绝。
      - name: Update smoke (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          B=src-tauri/target/release/bundle/macos
          rm -rf "$RUNNER_TEMP/upd-old" "$RUNNER_TEMP/upd-new" && mkdir -p "$RUNNER_TEMP/upd-old" "$RUNNER_TEMP/upd-new"
          cp -R "$B/Cindy Tauri.app" "$RUNNER_TEMP/upd-old/"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));c.version=process.argv[3];fs.writeFileSync(process.argv[2],JSON.stringify(c))" "$RUNNER_TEMP/updater-ci.json" "$RUNNER_TEMP/updater-ci-v2.json" "$NEXT_VERSION"
          npx tauri build --bundles app -c "$RUNNER_TEMP/updater-ci-v2.json"
          cp "$B/Cindy Tauri.app.tar.gz" "$B/Cindy Tauri.app.tar.gz.sig" "$RUNNER_TEMP/upd-new/"
          node scripts/update-smoke.mjs --old "$RUNNER_TEMP/upd-old/Cindy Tauri.app" --new "$RUNNER_TEMP/upd-new/Cindy Tauri.app.tar.gz" --version "$NEXT_VERSION" --tamper 1
          node scripts/update-smoke.mjs --old "$RUNNER_TEMP/upd-old/Cindy Tauri.app" --new "$RUNNER_TEMP/upd-new/Cindy Tauri.app.tar.gz" --version "$NEXT_VERSION"

      - name: Update smoke (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          N=src-tauri/target/release/bundle/nsis
          rm -rf "$RUNNER_TEMP/upd-old" "$RUNNER_TEMP/upd-new" && mkdir -p "$RUNNER_TEMP/upd-old" "$RUNNER_TEMP/upd-new"
          cp "$N"/*"_${APP_VERSION}_x64-setup.exe" "$RUNNER_TEMP/upd-old/"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));c.version=process.argv[3];fs.writeFileSync(process.argv[2],JSON.stringify(c))" "$RUNNER_TEMP/updater-ci.json" "$RUNNER_TEMP/updater-ci-v2.json" "$NEXT_VERSION"
          npx tauri build --bundles nsis -c "$RUNNER_TEMP/updater-ci-v2.json"
          cp "$N"/*"_${NEXT_VERSION}_x64-setup.exe" "$N"/*"_${NEXT_VERSION}_x64-setup.exe.sig" "$RUNNER_TEMP/upd-new/"
          node scripts/update-smoke.mjs --old "$(ls "$RUNNER_TEMP"/upd-old/*-setup.exe)" --new "$(ls "$RUNNER_TEMP"/upd-new/*-setup.exe)" --version "$NEXT_VERSION"

  # v* 标签：两个平台的构建和冒烟都通过后才发布。latest.json 同时给带安装类型和不带的键。
  publish:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$V" != "$TAG" ]; then echo "tag $TAG does not match tauri.conf.json version $V"; exit 1; fi
          MAC="release/Cindy-Tauri_${V}_aarch64.app.tar.gz"
          WIN="release/Cindy-Tauri_${V}_x64-setup.exe"
          node scripts/latest-json.mjs --version "$V" --notes "Cindy Tauri $V" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" --out release/latest.json \
            darwin-aarch64-app="$MAC" darwin-aarch64="$MAC" windows-x86_64-nsis="$WIN" windows-x86_64="$WIN"
          ls -l release
          gh release create "$TAG" --title "Cindy Tauri $V" --notes "Cindy Tauri $V（未签名构建：macOS 首次打开被拦截后，到「系统设置 → 隐私与安全性」点「仍要打开」；Windows 在 SmartScreen 点「更多信息 → 仍要运行」）" \
            release/Cindy-Tauri_* release/latest.json
